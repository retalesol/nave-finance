[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = [
    {access = "read", path = "./"},
    {access = "read-write", path = "./deployments"},
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@pythnetwork/pyth-sdk-solidity/=lib/pyth-sdk-solidity/",
    "@chainlink/=lib/chainlink-brownie-contracts/contracts/src/v0.8/",
    "forge-std/=lib/forge-std/src/",
]

# Mainnet-fork integration tests read these. `forge test` without the env vars
# set will skip the fork tests (they `vm.skip(true)` when the RPC URL is empty).
# Robinhood Chain (Arbitrum Nitro L2): mainnet 4663, testnet 46630. The RPC
# URLs carry a provider API key, so they live ONLY in env vars (never here).
[rpc_endpoints]
mainnet = "${ETH_MAINNET_RPC_URL}"
base = "${BASE_MAINNET_RPC_URL}"
sepolia = "${ETH_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
robinhood = "${EVM_ROBINHOOD_RPC_URL}"
robinhood_testnet = "${EVM_ROBINHOOD_TESTNET_RPC_URL}"

# Robinhood Chain verification runs against Blockscout (no Etherscan instance).
# Blockscout's etherscan-compatible API ignores the key, so a non-secret
# placeholder is fine. For direct Blockscout verification use:
#   forge verify-contract --verifier blockscout \
#     --verifier-url https://robinhoodchain.blockscout.com/api <addr> <contract>
# (testnet: --verifier-url https://explorer.testnet.chain.robinhood.com/api)
[etherscan]
robinhood = { key = "blockscout", chain = 4663, url = "https://robinhoodchain.blockscout.com/api" }
robinhood_testnet = { key = "blockscout", chain = 46630, url = "https://explorer.testnet.chain.robinhood.com/api" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
