[package]
name = "nave_execution"
version = "0.1.0"
description = "Nave Finance execution program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nave_execution"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token", "anchor-spl/associated_token", "nave_core/idl-build", "nave_governance/idl-build", "nave_kamino_adapter/idl-build", "nave_jito_adapter/idl-build", "nave_marginfi_adapter/idl-build"]
default = []
mainnet = ["nave_core/mainnet"]

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", features = ["token", "associated_token"] }
solana-program = "2"
pyth-solana-receiver-sdk = "1.2.0"
nave_core = { path = "../nave_core", features = ["cpi"] }
nave_governance = { path = "../nave_governance", features = ["cpi"] }
nave_kamino_adapter = { path = "../nave_kamino_adapter", features = ["cpi"] }
nave_jito_adapter = { path = "../nave_jito_adapter", features = ["cpi"] }
nave_marginfi_adapter = { path = "../nave_marginfi_adapter", features = ["cpi"] }
