[package]
name = "nave_staking"
version = "0.1.0"
description = "Nave central staking reward pool (stake NAVE, earn bridge-fee rewards)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nave_staking"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "anchor-spl/token", "anchor-spl/associated_token"]
default = []
mainnet = []

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", features = ["token", "associated_token"] }
