name: App CI (local tests)

on:
  push:
    branches: [main, master]
    paths:
      - 'app/src/**'
      - 'app/eval/**'
      - 'app/scripts/**'
      - 'app/tests/**'
      - 'app/signer-service/**'
      - 'app/supabase/functions/**'
      - 'app/package.json'
      - 'app/playwright.config.ts'
      - '.github/workflows/app-ci.yml'
  pull_request:
    paths:
      - 'app/src/**'
      - 'app/eval/**'
      - 'app/scripts/**'
      - 'app/tests/**'
      - 'app/signer-service/**'
      - 'app/supabase/functions/**'
      - 'app/package.json'
      - 'app/playwright.config.ts'
      - '.github/workflows/app-ci.yml'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck (blocking)
        run: npm run typecheck
      - name: Lint (visible, not yet blocking)
        # There is a tracked pre-existing lint debt (~120 `no-explicit-any` /
        # unused-var errors, mostly in supabase/functions/, predating this CI
        # gate — see docs/AUDIT_FINDINGS.md). Running it here makes lint state
        # visible on every PR for the first time; `continue-on-error` keeps CI
        # green while that debt is paid down, rather than either hiding lint
        # entirely (the prior state) or breaking every PR on day one for
        # pre-existing issues unrelated to the change being reviewed. Flip
        # `continue-on-error` to `false` once the pre-existing errors are
        # cleared.
        run: npm run lint
        continue-on-error: true

  signer-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/signer-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the production Dockerfile (node:22-slim). Node 22 ships a
          # native global WebSocket, which @supabase/supabase-js and
          # rpc-websockets require at client construction (audit L-1); running
          # CI on the same major avoids a Node-20/22 divergence.
          node-version: '22'
          cache: npm
          cache-dependency-path: app/signer-service/package-lock.json
      - run: npm ci
      - name: Typecheck (blocking)
        run: npm run typecheck
      - name: Tests (blocking) — bridge relayer + staking mirror + rate limiter
        # Hermetic: mock Solana RPC / EVM RPC / Supabase servers, no secrets.
        run: npm test

  eval-and-scripts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run eval:ci
      - name: Syntax-check verifier scripts
        run: |
          node --check scripts/verify-e2e-gate.mjs
          node --check scripts/devnet-multichain-verify.mjs
          node --check scripts/agentic-e2e-run-verifiers.mjs
          node --check scripts/agentic-e2e-checkpoint.mjs
          node --check scripts/test-devnet-multichain.mjs

  playwright-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Playwright smoke (skipped without VITE_* env)
        run: npm run test:e2e
        env:
          # Minimal devnet boot env (mirrors .env.example) so Vite can start in CI.
