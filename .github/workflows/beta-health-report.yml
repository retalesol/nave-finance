name: beta-health-report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  health-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NAVE_SIGNER_URL: ${{ secrets.NAVE_SIGNER_URL }}
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate health report
        id: report
        run: |
          set +e
          npm run beta:health-report > beta-health-report.md
          status=$?
          cat beta-health-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-health-report
          path: beta-health-report.md

      - name: Fail on unhealthy endpoints
        if: steps.report.outputs.exit_code != '0'
        run: |
          echo "One or more endpoint health checks failed."
          exit 1
