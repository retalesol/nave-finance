<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nave — shared layer scaffold</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="demo-base.css" />
  <style>
    /* Page-specific layout only; everything reusable lives in demo-base.css */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: var(--nav-height);
      display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
      background: hsla(0, 0%, 100%, 0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid hsl(var(--border));
    }
    .nav .brand { font-size: 22px; }
    .nav ul { display: flex; gap: 28px; }
    .nav li a { font-size: 13.5px; color: hsl(var(--muted-foreground)); transition: color var(--duration-base); }
    .nav li a:hover { color: hsl(var(--foreground)); }

    .hero {
      position: relative; min-height: 94vh; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      padding: 176px 24px 112px;
    }
    .hero-vignette {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse 60% 50% at 50% 45%, hsl(var(--background)) 30%, transparent 85%);
    }
    .hero > .z { position: relative; z-index: 10; }
    .hero h1 { font-size: clamp(34px, 6.5vw, 76px); line-height: 1.05; letter-spacing: -0.02em; max-width: 820px; margin-bottom: 24px; }
    .hero p.sub { font-size: 16.5px; line-height: 1.7; color: hsl(var(--muted-foreground)); max-width: 576px; }
    .hero .ctas { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 40px; }
    .hero .line { height: 1px; background: hsl(var(--border-strong)); margin: 56px auto 0; }
    .hero .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 64px; margin-top: 40px; }
    .hero .stat .v { font-size: 28px; }
    .hero .stat .l { font-size: 11px; font-family: var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: hsl(var(--muted-foreground)); margin-top: 4px; }

    .section { padding: 112px 0; }
    .supply { position: relative; overflow: hidden; min-height: 300px; max-width: 520px; margin: 0 auto; }
    .supply .wash { position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(ellipse 70% 60% at 50% 45%, hsl(var(--surface-0)) 20%, transparent 90%); }
    .supply .body { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 56px 24px; }
    .supply .big { font-size: clamp(44px, 8vw, 72px); letter-spacing: -0.02em; line-height: 1; }
    .supply .stats { display: flex; gap: 20px; margin-top: 24px; }
    .supply .stats .v { font-family: var(--font-mono); font-size: 16px; }
    .grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .feature { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .feature .t { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .feature p { font-size: 13.5px; line-height: 1.65; color: hsl(var(--muted-foreground)); }
    footer { border-top: 1px solid hsl(var(--border)); padding: 48px 0; font-size: 13px; color: hsl(var(--muted-foreground)); }
  </style>
</head>
<body>
  <header class="nav">
    <span class="text-display brand">Nave</span>
    <ul id="nav"></ul>
    <span class="nave-tag">scaffold</span>
  </header>

  <!-- Hero: full-viewport ocean dither behind real copy -->
  <section class="hero">
    <div class="nave-dither-layer" aria-hidden="true"><canvas id="hero-sea" class="nave-dither-canvas"></canvas></div>
    <div class="hero-vignette" aria-hidden="true"></div>

    <h1 class="z text-display hero-h1" id="hero-h1"></h1>
    <p class="z sub hero-sub" id="hero-sub"></p>
    <div class="z ctas hero-cta">
      <a class="nave-btn nave-btn-primary" href="#" id="cta-1"></a>
      <a class="nave-btn nave-btn-secondary" href="#" id="cta-2"></a>
    </div>
    <div class="z line hero-line"></div>
    <div class="z stats" id="hero-stats"></div>
  </section>

  <!-- Features: scroll-reveal smoke test -->
  <section class="section" id="product">
    <div class="nave-container">
      <div class="sr-hidden" style="text-align:center; margin-bottom: 56px;">
        <div class="nave-section-label" style="margin-bottom: 16px;" id="f-label"></div>
        <h2 class="text-display" style="font-size: clamp(28px, 4vw, 44px); letter-spacing: -0.02em;" id="f-h2"></h2>
      </div>
      <div class="grid3 sr-hidden sr-stagger" id="features"></div>
    </div>
  </section>

  <!-- Tokenomics supply card: contained waves-mode dither -->
  <section class="section" id="tokenomics" style="background: hsl(var(--surface-1)); border-top: 1px solid hsl(var(--border)); border-bottom: 1px solid hsl(var(--border));">
    <div class="nave-container">
      <div class="nave-card supply sr-hidden" data-reveal="scale">
        <div class="nave-dither-layer" style="opacity: 0.4;" aria-hidden="true"><canvas id="card-sea" class="nave-dither-canvas"></canvas></div>
        <div class="wash" aria-hidden="true"></div>
        <div class="body">
          <div class="nave-label" style="font-size: 10px; margin-bottom: 12px;" id="s-label"></div>
          <div class="text-display big" id="s-supply"></div>
          <div class="nave-chip" style="margin-top: 12px; font-size: 13px;" id="s-ticker"></div>
          <div style="font-size: 12.5px; color: hsl(var(--muted-foreground)); margin-top: 12px; max-width: 260px; line-height: 1.6;" id="s-caption"></div>
          <div class="stats" id="s-stats"></div>
          <div class="nave-chip" style="margin-top: 20px; border-radius: 999px; font-size: 11.5px; font-weight: 400; color: hsl(var(--muted-foreground));" id="s-contract"></div>
        </div>
      </div>
    </div>
  </section>

  <footer><div class="nave-container"><span class="text-display" style="font-size: 20px; color: hsl(var(--foreground));">Nave</span><p id="footer-text" style="margin-top: 6px; max-width: 340px; line-height: 1.6;"></p></div></footer>

  <script src="copy.js"></script>
  <script src="reveal.js"></script>
  <script src="dither.js"></script>
  <script>
    (function () {
      var C = NAVE_COPY, $ = function (id) { return document.getElementById(id); };
      var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

      // ── Fill real copy ──
      $('nav').innerHTML = C.nav.map(function (n) { return '<li><a href="' + n.href + '">' + esc(n.label) + '</a></li>'; }).join('');
      $('hero-h1').innerHTML = esc(C.hero.h1) + '<br><span class="italic-muted">' + esc(C.hero.h1Italic) + '</span>';
      $('hero-sub').textContent = C.hero.sub;
      $('cta-1').textContent = C.hero.ctaPrimary.label;
      $('cta-2').textContent = C.hero.ctaSecondary.label;
      $('hero-stats').innerHTML = C.hero.stats.map(function (s) {
        return '<div class="stat hero-stat"><div class="text-display v">' + esc(s.value) + '</div><div class="l">' + esc(s.label) + '</div></div>';
      }).join('');
      $('f-label').textContent = C.features.sectionLabel;
      $('f-h2').textContent = C.features.h2;
      $('features').innerHTML = C.features.items.map(function (f) {
        return '<div class="nave-card nave-card-hover feature"><span class="nave-tag" style="align-self:flex-start">' + esc(f.tag) + '</span>' +
          '<div><div class="t">' + esc(f.title) + '</div><p>' + esc(f.desc) + '</p></div></div>';
      }).join('');
      var S = C.tokenomics.supplyCard;
      $('s-label').textContent = S.label; $('s-supply').textContent = S.supply; $('s-ticker').textContent = S.ticker;
      $('s-caption').textContent = S.caption; $('s-contract').textContent = S.contractButton;
      $('s-stats').innerHTML = S.stats.map(function (s) {
        return '<div><div class="nave-label" style="font-size:9px;margin-bottom:3px">' + esc(s.label) + '</div><div class="v">' + esc(s.value) + '</div></div>';
      }).join('');
      $('footer-text').textContent = C.footer.text;

      // ── Scroll reveal ──
      NaveReveal.init('.sr-hidden');

      // ── Dither: hero (ocean, same props as Index.tsx) ──
      var hero = NaveDither.mount('#hero-sea', C.ditherPresets.hero);

      // ── Dither: supply card (waves) ──
      var card = NaveDither.mount('#card-sea', C.ditherPresets.tokenomics);

      // ── Scroll-driven uniform recipe: pan the water + fade the boat as you leave the hero ──
      var heroEl = document.querySelector('.hero');
      NaveScroll.onScroll(function () {
        var p = NaveScroll.progress(heroEl, { start: 0, end: 0 }); // 0 at top, 1 when hero has scrolled out
        hero.set({ scroll: p, boatOpacity: 1 - p });
      });

      // Expose for console poking / screenshots.
      window.__nave = { hero: hero, card: card };
    })();
  </script>
</body>
</html>
